[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orca-procurement"
version = "0.1.0"
description = "Global AI Agricultural Procurement Agent - Conversational procurement, billing, and collection workflow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/orca"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
